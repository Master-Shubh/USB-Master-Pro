name: USB Master Pro Cloud Production Build Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Sign Unified Windows Executable (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable MSVC Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Signaling Server Dependencies
        shell: bash
        run: |
          cd signaling
          npm install

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Windows 11 SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v1
        with:
          sdk-version: 22621

      - name: Compile & Verify KMDF Drivers (anyusb_vhci & anyusb_filter)
        shell: pwsh
        run: |
          Write-Host "================================================================="
          Write-Host "Checking for Windows Driver Kit (WDK) compilation toolchain..."
          Write-Host "================================================================="
          $wdkInclude = Test-Path "C:\Program Files (x86)\Windows Kits\10\Include\*\km"
          if (-not $wdkInclude) {
              throw "FATAL: WindowsKernelModeDriver10.0 platform toolset missing. WDK compilation toolchain is required."
          }
          Write-Host "WDK detected. Compiling KMDF drivers with MSBuild..."
          msbuild drivers/vhci/anyusb_vhci.vcxproj /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "FATAL: MSBuild compilation of anyusb_vhci.vcxproj failed with exit code $LASTEXITCODE" }
          msbuild drivers/filter/anyusb_filter.vcxproj /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "FATAL: MSBuild compilation of anyusb_filter.vcxproj failed with exit code $LASTEXITCODE" }
          Write-Host "KMDF drivers compiled successfully."

      - name: Test Core Turbo-URB Engine
        shell: bash
        run: |
          cargo test --release -p usb-master-core

      - name: Build Core CLI & Daemon
        shell: bash
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p usb-master-core

      - name: Install Inno Setup Compiler
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Package USB Master Pro Portable Artifact
        shell: bash
        run: |
          mkdir -p dist/bin dist/installer
          cp target/x86_64-pc-windows-msvc/release/usb_master_cli.exe dist/bin/USBMasterPro.exe || cp target/release/usb_master_cli.exe dist/bin/USBMasterPro.exe || cp core/target/x86_64-pc-windows-msvc/release/usb_master_cli.exe dist/bin/USBMasterPro.exe
          cp target/x86_64-pc-windows-msvc/release/usb_master_daemon.exe dist/bin/USBMasterDaemon.exe || cp target/release/usb_master_daemon.exe dist/bin/USBMasterDaemon.exe || cp core/target/x86_64-pc-windows-msvc/release/usb_master_daemon.exe dist/bin/USBMasterDaemon.exe
          test -f dist/bin/USBMasterPro.exe || { echo "FATAL: USBMasterPro.exe missing!"; exit 1; }
          test -f dist/bin/USBMasterDaemon.exe || { echo "FATAL: USBMasterDaemon.exe missing!"; exit 1; }
          cp -r ui dist/
          cp -r scripts dist/
          cp -r drivers dist/
          echo "Packaging complete in dist/:"
          ls -la dist/bin/

      - name: Compile 1-Click Windows Setup Wizard
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\usb_master_pro.iss
          if ($LASTEXITCODE -ne 0) { throw "FATAL: Inno Setup compiler (ISCC.exe) failed with exit code $LASTEXITCODE" }
          Write-Host "Setup Wizard compiled successfully in dist/installer/"
          ls dist\installer\

      - name: Upload 1-Click Windows Setup Wizard Installer
        uses: actions/upload-artifact@v4
        with:
          name: USB-Master-Pro-v1.0.0-Setup-Wizard
          path: dist/installer/USBMasterPro-Setup-v1.0.0.exe
          if-no-files-found: error

      - name: Upload Full Distribution Package
        uses: actions/upload-artifact@v4
        with:
          name: USB-Master-Pro-v1.0.0-Windows-x64
          path: dist/
          if-no-files-found: error
