name: USB Master Pro — Windows Release Build & Driver Signing Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-release:
    name: Build & Package Windows x64 Release Bundle
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable MSVC Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: 'x64'

      - name: Setup Windows 11 SDK (22621)
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v1
        with:
          sdk-version: 22621

      - name: Install & Configure Windows Driver Kit (WDK 11)
        run: |
          Write-Host "=================================================================="
          Write-Host "Checking for Windows Driver Kit (WDK 11) & MSBuild Toolsets..."
          Write-Host "=================================================================="

          $vsMsbuildToolsetDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets\WindowsKernelModeDriver10.0"

          function Find-WdkVsix {
              $searchRoots = @(
                  "C:\Program Files (x86)\Windows Kits\10\Vsix",
                  "C:\Program Files\Windows Kits\10\Vsix"
              )
              foreach ($root in $searchRoots) {
                  if (Test-Path $root) {
                      $match = Get-ChildItem -Path $root -Recurse -Filter "WDK.vsix" -ErrorAction SilentlyContinue | Select-Object -First 1
                      if ($match) { return $match.FullName }
                  }
              }
              return $null
          }

          $vsixPath = Find-WdkVsix

          if (-not (Test-Path $vsMsbuildToolsetDir) -and -not $vsixPath) {
              Write-Host "WDK toolset not detected. Attempting Chocolatey install..."
              try {
                  choco install windowsdriverkit11 -y --no-progress
              } catch {
                  Write-Warning "Chocolatey install warning: $_"
              }
              $vsixPath = Find-WdkVsix
          }

          if (-not (Test-Path $vsMsbuildToolsetDir) -and -not $vsixPath) {
              Write-Host "WDK VSIX still not found. Downloading official Microsoft WDK installer..."
              $wdkSetupUrl = "https://go.microsoft.com/fwlink/?linkid=2324617"
              $wdkSetupPath = "$env:TEMP\wdksetup.exe"
              Invoke-WebRequest -Uri $wdkSetupUrl -OutFile $wdkSetupPath -UseBasicParsing
              Write-Host "Running wdksetup.exe silently..."
              $proc = Start-Process -FilePath $wdkSetupPath -ArgumentList "/q /norestart" -Wait -PassThru
              Write-Host "wdksetup.exe exited with code $($proc.ExitCode)"
              $vsixPath = Find-WdkVsix
          }

          if ($vsixPath) {
              Write-Host "Found WDK VSIX at: $vsixPath"
              $vsixInstaller = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\VSIXInstaller.exe"
              if (Test-Path $vsixInstaller) {
                  Write-Host "Running VSIXInstaller in quiet admin mode..."
                  Start-Process -FilePath $vsixInstaller -ArgumentList "/quiet /admin `"$vsixPath`"" -Wait
              }
          }

          # Direct extraction fallback: Ensure WindowsKernelModeDriver10.0 is directly deployed to MSBuild VC v170
          if (-not (Test-Path $vsMsbuildToolsetDir) -and $vsixPath) {
              Write-Host "Extracting WindowsKernelModeDriver10.0 toolsets from VSIX directly..."
              $extractDir = "$env:TEMP\wdk_vsix_extracted"
              if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
              $zipFile = "$env:TEMP\wdk_vsix.zip"
              Copy-Item $vsixPath $zipFile -Force
              Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force

              # Check if full v170 tree exists inside the VSIX
              $v170Dir = Get-ChildItem -Path $extractDir -Recurse -Directory | Where-Object { $_.Name -ieq "v170" -and $_.Parent.Name -ieq "VC" } | Select-Object -First 1
              if ($v170Dir) {
                  Write-Host "Copying full v170 tree from $($v170Dir.FullName)..."
                  $vcDest = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170"
                  Copy-Item -Path "$($v170Dir.FullName)\*" -Destination $vcDest -Recurse -Force
              }

              # Ensure x64, Win32, and ARM64 platform toolsets are deployed
              $foundToolsets = Get-ChildItem -Path $extractDir -Recurse -Directory -Filter "WindowsKernelModeDriver10.0"
              foreach ($ts in $foundToolsets) {
                  $platform = "x64"
                  if ($ts.FullName -match 'Platforms[\\/](x64|Win32|ARM64|arm64)[\\/]') {
                      $platform = $Matches[1]
                  }
                  $dest = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\Platforms\$platform\PlatformToolsets\WindowsKernelModeDriver10.0"
                  $destParent = Split-Path $dest -Parent
                  if (-not (Test-Path $destParent)) {
                      New-Item -ItemType Directory -Path $destParent -Force | Out-Null
                  }
                  Copy-Item -Path $ts.FullName -Destination $dest -Recurse -Force
                  Write-Host "Deployed $platform toolset from $($ts.FullName) to $dest"
              }
          }

          if (-not (Test-Path $vsMsbuildToolsetDir)) {
              throw "FATAL: WindowsKernelModeDriver10.0 platform toolset missing at $vsMsbuildToolsetDir"
          }
          Write-Host "Verified WDK toolset present at: $vsMsbuildToolsetDir"
          Write-Host "WDK 11 toolchain configuration completed successfully."

      - name: Compile KMDF Drivers (anyusb_vhci & anyusb_filter)
        run: |
          Write-Host "=================================================================="
          Write-Host "Compiling anyusb_vhci.vcxproj (Release | x64)..."
          Write-Host "=================================================================="
          msbuild drivers/vhci/anyusb_vhci.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:SignMode=Off /p:EnableInfVerif=false /v:m
          if ($LASTEXITCODE -ne 0) {
              throw "FATAL: MSBuild compilation of anyusb_vhci.vcxproj failed with exit code $LASTEXITCODE"
          }

          $vhciSys = Get-ChildItem -Path . -Recurse -Filter "anyusb_vhci.sys" | Select-Object -First 1
          if ($vhciSys) {
              Copy-Item $vhciSys.FullName "drivers/vhci/anyusb_vhci.sys" -Force
              Write-Host "Successfully staged drivers/vhci/anyusb_vhci.sys ($($vhciSys.Length) bytes)"
          } else {
              throw "FATAL: anyusb_vhci.sys was not produced by MSBuild!"
          }

          $vhciInf = Get-ChildItem -Path "bin", "drivers\vhci\x64" -Recurse -Filter "anyusb_vhci.inf" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vhciInf -and ($vhciInf.FullName -ne (Resolve-Path "drivers/vhci/anyusb_vhci.inf").Path)) {
              Copy-Item $vhciInf.FullName "drivers/vhci/anyusb_vhci.inf" -Force
              Write-Host "Successfully synced MSBuild stamped INF to drivers/vhci/anyusb_vhci.inf"
          }

          Write-Host "=================================================================="
          Write-Host "Compiling anyusb_filter.vcxproj (Release | x64)..."
          Write-Host "=================================================================="
          msbuild drivers/filter/anyusb_filter.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10 /p:SignMode=Off /p:EnableInfVerif=false /v:m
          if ($LASTEXITCODE -ne 0) {
              throw "FATAL: MSBuild compilation of anyusb_filter.vcxproj failed with exit code $LASTEXITCODE"
          }

          $filterSys = Get-ChildItem -Path . -Recurse -Filter "anyusb_filter.sys" | Select-Object -First 1
          if ($filterSys) {
              Copy-Item $filterSys.FullName "drivers/filter/anyusb_filter.sys" -Force
              Write-Host "Successfully staged drivers/filter/anyusb_filter.sys ($($filterSys.Length) bytes)"
          } else {
              throw "FATAL: anyusb_filter.sys was not produced by MSBuild!"
          }

          $filterInf = Get-ChildItem -Path "bin", "drivers\filter\x64" -Recurse -Filter "anyusb_filter.inf" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($filterInf -and ($filterInf.FullName -ne (Resolve-Path "drivers/filter/anyusb_filter.inf").Path)) {
              Copy-Item $filterInf.FullName "drivers/filter/anyusb_filter.inf" -Force
              Write-Host "Successfully synced MSBuild stamped INF to drivers/filter/anyusb_filter.inf"
          }

      - name: Generate Catalogs (Inf2Cat) & Test-Sign Drivers
        run: |
          Write-Host "=================================================================="
          Write-Host "Executing automated field-test signing via setup_field_test_signing.ps1..."
          Write-Host "=================================================================="
          & ".\scripts\setup_field_test_signing.ps1" -DriverRootPath "$PWD\drivers" -ForceRegenerateCert
          if ($LASTEXITCODE -ne 0) {
              throw "FATAL: setup_field_test_signing.ps1 failed with exit code $LASTEXITCODE"
          }

          $expectedDriverFiles = @(
              "drivers/vhci/anyusb_vhci.sys",
              "drivers/vhci/anyusb_vhci.inf",
              "drivers/vhci/anyusb_vhci.cat",
              "drivers/filter/anyusb_filter.sys",
              "drivers/filter/anyusb_filter.inf",
              "drivers/filter/anyusb_filter.cat",
              "drivers/bhartx_test_ca.cer"
          )
          foreach ($file in $expectedDriverFiles) {
              if (-not (Test-Path $file)) {
                  throw "FATAL: Missing expected driver package artifact: $file"
              }
              $fileItem = Get-Item $file
              if ($fileItem.Length -le 0) {
                  throw "FATAL: Driver package artifact $file is empty (0 bytes)!"
              }
              Write-Host "Verified driver file: $file ($($fileItem.Length) bytes)"
          }

          # Verify that .sys and .cat files exist and have valid digital signatures
          $signedDriverArtifacts = @(
              "drivers/vhci/anyusb_vhci.sys",
              "drivers/vhci/anyusb_vhci.cat",
              "drivers/filter/anyusb_filter.sys",
              "drivers/filter/anyusb_filter.cat"
          )
          foreach ($sf in $signedDriverArtifacts) {
              $sig = Get-AuthenticodeSignature -FilePath $sf
              if ($sig.Status -ne "Valid") {
                  throw "FATAL: Digital signature verification failed for $sf (Status: $($sig.Status))"
              }
              Write-Host "Verified valid Authenticode signature for $sf (Signer: $($sig.SignerCertificate.Subject))"
          }

      - name: Compile Rust Turbo-URB Engine (usb_master_daemon & usb_master_cli)
        run: |
          Write-Host "=================================================================="
          Write-Host "Compiling Rust workspace for x86_64-pc-windows-msvc (Release)..."
          Write-Host "=================================================================="
          cargo build --release --target x86_64-pc-windows-msvc -p usb-master-core --bin usb_master_daemon --bin usb_master_cli

          $daemonPath = "target/x86_64-pc-windows-msvc/release/usb_master_daemon.exe"
          $cliPath = "target/x86_64-pc-windows-msvc/release/usb_master_cli.exe"

          if (-not (Test-Path $daemonPath)) {
              Write-Error "FATAL: $daemonPath was not found!"
              exit 1
          }
          if (-not (Test-Path $cliPath)) {
              Write-Error "FATAL: $cliPath was not found!"
              exit 1
          }
          Write-Host "Rust binaries built successfully:"
          Write-Host "  Daemon: $daemonPath ($((Get-Item $daemonPath).Length) bytes)"
          Write-Host "  CLI:    $cliPath ($((Get-Item $cliPath).Length) bytes)"

      - name: Verify Release Artifacts for Secret & Root Seed Leaks
        run: |
          Write-Host "=================================================================="
          Write-Host "Running release secret leak gate (scripts/verify_no_leaks.ps1)..."
          Write-Host "=================================================================="
          & ".\scripts\verify_no_leaks.ps1" -TargetDir "target/x86_64-pc-windows-msvc/release" -DriversDir "drivers"
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Security leak gate failed!"
              exit 1
          }

      - name: Package USB Master Pro Windows Release Bundle (.zip)
        run: |
          Write-Host "=================================================================="
          Write-Host "Packaging usb-master-pro-windows-x64.zip release bundle..."
          Write-Host "=================================================================="
          $bundleDir = "$PWD\dist\usb-master-pro-windows-x64"
          if (Test-Path $bundleDir) { Remove-Item $bundleDir -Recurse -Force }

          New-Item -ItemType Directory -Path "$bundleDir\drivers\vhci" -Force | Out-Null
          New-Item -ItemType Directory -Path "$bundleDir\drivers\filter" -Force | Out-Null

          # 1. User-mode binaries
          Copy-Item "target/x86_64-pc-windows-msvc/release/usb_master_daemon.exe" "$bundleDir\" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/usb_master_cli.exe" "$bundleDir\" -Force

          # 2. Kernel drivers, manifests, catalogs & certificate
          Copy-Item "drivers/vhci/anyusb_vhci.sys" "$bundleDir\drivers\vhci\" -Force
          Copy-Item "drivers/vhci/anyusb_vhci.inf" "$bundleDir\drivers\vhci\" -Force
          Copy-Item "drivers/vhci/anyusb_vhci.cat" "$bundleDir\drivers\vhci\" -Force
          Copy-Item "drivers/filter/anyusb_filter.sys" "$bundleDir\drivers\filter\" -Force
          Copy-Item "drivers/filter/anyusb_filter.inf" "$bundleDir\drivers\filter\" -Force
          Copy-Item "drivers/filter/anyusb_filter.cat" "$bundleDir\drivers\filter\" -Force
          Copy-Item "drivers/bhartx_test_ca.cer" "$bundleDir\drivers\" -Force

          # 3. Scripts and Documentation
          Copy-Item "scripts/install_zero_reboot.bat" "$bundleDir\" -Force
          Copy-Item "scripts/uninstall_zero_reboot.bat" "$bundleDir\" -Force
          Copy-Item "scripts/setup_field_test_signing.ps1" "$bundleDir\" -Force
          Copy-Item "README_INSTALL.md" "$bundleDir\" -Force

          # Explicit Packaging Validation Step
          Write-Host "=================================================================="
          Write-Host "Validating release bundle contents in $bundleDir..."
          Write-Host "=================================================================="
          $expectedBundleFiles = @(
              "usb_master_daemon.exe",
              "usb_master_cli.exe",
              "drivers\vhci\anyusb_vhci.sys",
              "drivers\vhci\anyusb_vhci.inf",
              "drivers\vhci\anyusb_vhci.cat",
              "drivers\filter\anyusb_filter.sys",
              "drivers\filter\anyusb_filter.inf",
              "drivers\filter\anyusb_filter.cat"
          )
          foreach ($relPath in $expectedBundleFiles) {
              $fullPath = Join-Path $bundleDir $relPath
              if (-not (Test-Path $fullPath)) {
                  throw "FATAL: Expected bundle file missing: $relPath at $fullPath"
              }
              $fItem = Get-Item $fullPath
              if ($fItem.Length -le 0) {
                  throw "FATAL: Expected bundle file $relPath is empty (0 bytes)!"
              }
              Write-Host "Verified bundle artifact: $relPath ($($fItem.Length) bytes)"
          }

          # 4. Generate Zip Archive
          $zipPath = "$PWD\dist\usb-master-pro-windows-x64.zip"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $zipPath -Force
          Write-Host "Release bundle generated: $zipPath ($([math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB)"

          Get-ChildItem -Path $bundleDir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Compile 1-Click Windows Setup Wizard (Inno Setup)
        run: |
          Write-Host "=================================================================="
          Write-Host "Compiling Inno Setup 1-Click Windows Setup Wizard..."
          Write-Host "=================================================================="
          New-Item -ItemType Directory -Path "dist\bin" -Force | Out-Null
          New-Item -ItemType Directory -Path "dist\installer" -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/usb_master_cli.exe" "dist\bin\USBMasterPro.exe" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/usb_master_daemon.exe" "dist\bin\USBMasterDaemon.exe" -Force

          if (-not (Test-Path "dist\bin\USBMasterPro.exe") -or -not (Test-Path "dist\bin\USBMasterDaemon.exe")) {
              throw "FATAL: Staged user-mode binaries (USBMasterPro.exe / USBMasterDaemon.exe) missing in dist\bin"
          }

          choco install innosetup --no-progress -y
          $isccExe = if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
              "ISCC.exe"
          }
          & $isccExe /Q installer\usb_master_pro.iss
          if ($LASTEXITCODE -ne 0) {
              throw "FATAL: Inno Setup compiler (ISCC.exe) failed with exit code $LASTEXITCODE"
          }

          $installerPath = "dist\installer\USBMasterPro-Setup-v1.0.0.exe"
          if (-not (Test-Path $installerPath)) {
              throw "FATAL: Setup Wizard executable was not produced at $installerPath"
          }
          Write-Host "Setup Wizard compiled successfully: $installerPath ($((Get-Item $installerPath).Length) bytes)"

      - name: Upload Release Bundle (usb-master-pro-windows-x64.zip)
        uses: actions/upload-artifact@v4
        with:
          name: usb-master-pro-windows-x64
          path: dist/usb-master-pro-windows-x64.zip
          if-no-files-found: error

      - name: Upload 1-Click Setup Wizard Installer (USBMasterPro-Setup-v1.0.0.exe)
        uses: actions/upload-artifact@v4
        with:
          name: USB-Master-Pro-v1.0.0-Setup-Wizard
          path: dist/installer/USBMasterPro-Setup-v1.0.0.exe
          if-no-files-found: error
