[package]
name = "usb-master-core"
version = "1.0.0"
edition = "2021"
authors = ["BhartX Ecosystems Pvt Ltd <admin@bhartx.in>"]
homepage = "https://bhartx.in"
repository = "https://github.com/bhartx/usb-master-pro"
description = "High-performance Turbo-URB USB-over-IP core engine for USB Master Pro — Owned & Developed by BhartX Ecosystems Pvt Ltd"

[features]
default = []
test-utils = []

[dev-dependencies]
usb-master-core = { path = ".", features = ["test-utils"] }

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"
crossbeam-channel = "0.5"
axum = { version = "0.7", features = ["ws", "json"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
base64 = "0.22"
thiserror = "1.0"
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }

[lib]
name = "usb_master_core"
path = "src/lib.rs"

[[bin]]
name = "usb_master_cli"
path = "src/bin/cli.rs"

[[bin]]
name = "usb_master_daemon"
path = "src/bin/daemon.rs"
