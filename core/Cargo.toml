[package]
name = "usb-master-core"
version = "1.0.0"
edition = "2021"
authors = ["BhartX Ecosystems Pvt Ltd <admin@bhartx.in>"]
homepage = "https://bhartx.in"
repository = "https://github.com/bhartx/usb-master-pro"
description = "High-performance Turbo-URB USB-over-IP core engine for USB Master Pro — Owned & Developed by BhartX Ecosystems Pvt Ltd"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
zstd = "0.13"
crossbeam-channel = "0.5"

[lib]
name = "usb_master_core"
path = "src/lib.rs"

[[bin]]
name = "usb_master_cli"
path = "src/bin/cli.rs"
